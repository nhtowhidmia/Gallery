name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create Android project
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Gallery AI" com.galleryai.app --web-dir www
          npx cap add android
      - name: Add phone media code
        run: |
          D=android/app/src/main/java/com/galleryai/app
          cat > $D/MainActivity.java <<'EOF'
          package com.galleryai.app;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(PhoneMediaPlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          EOF
          cat > $D/PhoneMediaPlugin.java <<'EOF'
          package com.galleryai.app;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.MediaStore;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.PermissionState;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;
          import com.getcapacitor.PluginMethod;
          @CapacitorPlugin(name = "PhoneMedia", permissions = {
            @Permission(alias = "media33", strings = {"android.permission.READ_MEDIA_IMAGES", "android.permission.READ_MEDIA_VIDEO"}),
            @Permission(alias = "media", strings = {"android.permission.READ_EXTERNAL_STORAGE"})
          })
          public class PhoneMediaPlugin extends Plugin {
            private String alias() { return Build.VERSION.SDK_INT >= 33 ? "media33" : "media"; }
            @PluginMethod
            public void getMedia(PluginCall call) {
              if (getPermissionState(alias()) != PermissionState.GRANTED) {
                requestPermissionForAlias(alias(), call, "permDone");
                return;
              }
              load(call);
            }
            @PermissionCallback
            private void permDone(PluginCall call) {
              if (getPermissionState(alias()) == PermissionState.GRANTED) load(call);
              else call.reject("denied");
            }
            private void load(PluginCall call) {
              int limit = call.getInt("limit", 400);
              JSArray arr = new JSArray();
              query(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, "image", limit, arr);
              query(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, "video", limit, arr);
              JSObject r = new JSObject();
              r.put("items", arr);
              call.resolve(r);
            }
            private void query(Uri uri, String kind, int limit, JSArray arr) {
              String[] cols = {MediaStore.MediaColumns.DISPLAY_NAME, MediaStore.MediaColumns.DATA, MediaStore.MediaColumns.SIZE};
              Cursor c = getContext().getContentResolver().query(uri, cols, null, null, MediaStore.MediaColumns.DATE_ADDED + " DESC");
              if (c == null) return;
              try {
                int n = 0;
                while (c.moveToNext() && n < limit) {
                  JSObject o = new JSObject();
                  o.put("name", c.getString(0));
                  o.put("path", c.getString(1));
                  o.put("size", c.getLong(2));
                  o.put("kind", kind);
                  arr.put(o);
                  n++;
                }
              } finally {
                c.close();
              }
            }
          }
          EOF
          sed -i 's#<application#<uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/><uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/><uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/><application#' android/app/src/main/AndroidManifest.xml
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Gallery AI v${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
