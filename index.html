<style>
:root{--bg:#fff;--ink:#111;--mute:#6f6f6f;--bar:#efefef;--line:#e4e4e4;--acc:#2f7cf6}
@media (prefers-color-scheme:dark){:root{--bg:#000;--ink:#f2f2f2;--mute:#9b9b9b;--bar:#1e1e1e;--line:#222;--acc:#5b9cff;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
#hd{display:flex;align-items:center;gap:6px;padding:12px 16px 8px}
#back{display:none;align-items:center;justify-content:center;width:40px;height:40px;margin-left:-10px;border:0;background:none;color:var(--ink);font-size:28px}
#title{font-size:28px;font-weight:500;line-height:1.15}
#sub{font-size:13px;color:var(--mute)}
#main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.dh{padding:16px 16px 8px;font-size:15px;font-weight:600}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.t{position:relative;aspect-ratio:1;background:var(--bar);overflow:hidden}
.t img,.t video{width:100%;height:100%;object-fit:cover;display:block}
.pb{position:absolute;left:7px;bottom:5px;color:#fff;font-size:13px;text-shadow:0 0 5px #000}
.ag{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 14px;padding:8px 16px 24px}
.cv{aspect-ratio:1;border-radius:18px;overflow:hidden;background:var(--bar);display:flex;align-items:center;justify-content:center;color:var(--mute)}
.cv img,.cv video{width:100%;height:100%;object-fit:cover;display:block}
.cv.apc{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px;align-content:center}
.cv.apc img{border-radius:12px;object-fit:contain}
.nm{margin-top:6px;font-size:15px}
.ct{font-size:13px;color:var(--mute)}
.empty{padding:70px 28px;text-align:center;color:var(--mute);line-height:1.7}
.btn{margin-top:16px;border:0;border-radius:99px;background:var(--acc);color:#fff;font:600 16px system-ui,sans-serif;padding:12px 28px}
.row{display:flex;align-items:center;gap:14px;padding:10px 16px}
.ext{flex:none;width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;background:#7a7a7a}
.ext.pdf{background:#e5493a}.ext.doc,.ext.docx,.ext.rtf,.ext.odt{background:#2f7cf6}.ext.xls,.ext.xlsx,.ext.csv,.ext.ods{background:#1fa463}.ext.ppt,.ext.pptx,.ext.odp{background:#f08a24}
.rt{min-width:0}
.rn{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rm{font-size:12px;color:var(--mute)}
.apg{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 4px;padding:14px 8px 24px}
.app{text-align:center;font-size:12px;min-width:0;padding:0 2px}
.app img{width:56px;height:56px;display:block;margin:0 auto 6px}
.app div{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.25}
#nav{display:flex;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav button{flex:1;border:0;background:none;color:var(--mute);padding:8px 0 10px;font-family:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px}
#nav .ic{padding:4px 20px;border-radius:99px;display:flex}
#nav button.on{color:var(--ink);font-weight:600}
#nav button.on .ic{background:var(--bar)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;display:none;z-index:20;max-width:90%}
#vw{position:fixed;inset:0;background:#000;display:none;z-index:9;color:#fff}
#vw.show{display:block}
#vbox{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#vbox img,#vbox video{width:100%;height:100%;object-fit:contain}
.vtop{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;align-items:center;gap:4px;padding:calc(10px + env(safe-area-inset-top,0px)) 10px 28px;background:linear-gradient(rgba(0,0,0,.65),transparent);transition:opacity .2s}
#vback{background:none;border:0;color:#fff;font-size:28px;width:44px;height:44px}
#vt{font-size:16px;font-weight:600}
#vn{font-size:12px;opacity:.8;word-break:break-all}
#vw.hide .vtop{opacity:0;pointer-events:none}

.vacts{margin-left:auto;display:flex;align-items:center;gap:6px}
.vact{background:rgba(255,255,255,.16);border:0;color:#fff;width:38px;height:38px;border-radius:99px;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer}
#edmdl{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:15;padding:18px}
#edmdl.show{display:flex}
.edbox{background:var(--bar);color:var(--ink);width:100%;max-width:380px;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.edbox h3{margin:0;font-size:17px}
.edpv{width:100%;max-height:220px;object-fit:contain;border-radius:12px;background:#000}
.edbox label{font-size:13px;color:var(--mute);display:flex;flex-direction:column;gap:5px}
.edbox input[type=range]{width:100%}
.edbtns{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.edbtn{border:0;border-radius:99px;padding:9px 18px;font-size:14px;font-weight:600;cursor:pointer;background:#444;color:#fff}
.edbtn.pri{background:var(--acc)}
</style>
</head>

  io.disconnect();main.innerHTML="";
  var names=[],map={};
  items.forEach(function(i){if(!map[i.album]){map[i.album]=[];names.push(i.album)}map[i.album].push(i)});
  var g=el("div","ag");
  names.forEach(function(k){var cv=el("div","cv");cv.appendChild(media(map[k][0]));g.appendChild(albumCard(k,cv,String(map[k].length)))});
  var vids=albumItems(K_VID);
  if(vids.length){var cv=el("div","cv");cv.appendChild(media(vids[0]));g.appendChild(albumCard(K_VID,cv,String(vids.length)))}
  if(isNative){
    var dc=el("div","cv");
    dc.innerHTML='<svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/></svg>';
    g.appendChild(albumCard(K_DOCS,dc,docsGranted===false?"Allow access":String(docs.length)));
    var ac=el("div","cv apc");
    apps.slice(0,4).forEach(function(a){var im=el("img");im.alt="";im.src=a.icon;ac.appendChild(im)});
    g.appendChild(albumCard(K_APPS,ac,String(apps.length)));
  }
  if(!g.children.length){main.appendChild(emptyEl());return}
  main.appendChild(g);
}
function drawDocs(){
  io.disconnect();main.innerHTML="";
  if(docsGranted===false){
    var w=emptyEl("Documents need \u201CAll files access\u201D. Tap Allow, switch it on for Gallery AI, then come back.");
    var b=el("button","btn","Allow access");b.onclick=function(){P.requestFilesAccess()};
    w.appendChild(el("br"));w.appendChild(b);main.appendChild(w);return;
  }
  if(!docs.length){main.appendChild(emptyEl("No documents found"));return}
  docs.forEach(function(d){
    var r=el("div","row"),e=el("div","ext "+d.ext,d.ext.toUpperCase().slice(0,4)),t=el("div","rt");
    t.appendChild(el("div","rn",d.name));t.appendChild(el("div","rm",fmtSize(d.size)+(d.ts?" \u00B7 "+fmtDate(d.ts):"")));
    r.appendChild(e);r.appendChild(t);
    r.onclick=function(){P.openDoc({id:d.id,mime:d.mime}).catch(function(){toast("No app can open this file")})};
    main.appendChild(r);
  });
}
function drawApps(){
  io.disconnect();main.innerHTML="";
  if(!apps.length){main.appendChild(emptyEl("No apps found"));return}
  var g=el("div","apg");
  apps.forEach(function(a){
    var d=el("div","app"),im=el("img");im.alt="";im.src=a.icon;d.appendChild(im);d.appendChild(el("div",null,a.name));
    d.onclick=function(){P.launchApp({pkg:a.pkg}).catch(function(){toast("Cannot open this app")})};
    g.appendChild(d);
  });
  main.appendChild(g);
}
function refresh(top){
  items.sort(function(a,b){return b.ts-a.ts});
  var p=0,v=0;items.forEach(function(i){if(i.kind==="video")v++;else p++});
  $("title").textContent=album?label(album):"Gallery";
  $("sub").textContent=album===K_DOCS?docs.length+" documents":album===K_APPS?apps.length+" apps":album?albumItems(album).length+" items":p+" photos \u00B7 "+v+" videos";
  $("back").style.display=album?"flex":"none";
  $("tpics").className=tab==="pics"?"on":"";$("talb").className=tab==="albums"?"on":"";
  if(album===K_DOCS)drawDocs();else if(album===K_APPS)drawApps();else if(album)drawPics(albumItems(album));else if(tab==="albums")drawAlbums();else drawPics(items);
  if(top)main.scrollTop=0;
}
function showView(){
  var it=viewList[vi],box=$("vbox");box.innerHTML="";var m;
  if(it.kind==="video"){m=el("video");m.controls=true;m.autoplay=true;m.playsInline=true}
  else{m=el("img");m.alt=""}
  m.src=it.url;box.appendChild(m);
  $("vt").textContent=it.ts?fmtDate(it.ts)+", "+fmtTime(it.ts):it.name;
  $("vn").textContent=it.name+" \u00B7 "+fmtSize(it.size);
}
function openView(list,i){
  viewList=list;vi=i;showView();$("vw").classList.add("show");$("vw").classList.remove("hide");
  if(!viewOpen){viewOpen=true;history.pushState({v:1},"","#v")}
}
function closeView(){$("vw").classList.remove("show");$("vbox").innerHTML="";viewOpen=false}
function step(d){if(!viewList.length)return;vi=(vi+d+viewList.length)%viewList.length;showView()}
$("vback").onclick=function(){if(viewOpen)history.back()};
$("back").onclick=function(){if(album)history.back()};
window.addEventListener("popstate",function(){if(viewOpen)closeView();else if(album){album=null;refresh(true)}});
$("vbox").addEventListener("click",function(){$("vw").classList.toggle("hide")});
var sx=0;
$("vw").addEventListener("touchstart",function(e){sx=e.touches[0].clientX},{passive:true});
$("vw").addEventListener("touchend",function(e){var dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>70)step(dx<0?1:-1)},{passive:true});
$("tpics").onclick=function(){tab="pics";album=null;refresh(true)};
$("talb").onclick=function(){tab="albums";album=null;refresh(true)};
function softRefresh(){if(tab==="albums"||album)refresh(false)}
function loadDocs(){
  P.getDocs({}).then(function(r){
    docsGranted=!!r.granted;
    docs=(r.items||[]).map(function(m){var n=m.name||"",x=n.indexOf(".")>-1?n.split(".").pop().toLowerCase():"file";return{id:m.id,name:n,size:m.size||0,mime:m.mime||"",ext:x,ts:(m.date||0)*1000}});
    softRefresh();
  }).catch(function(){});
}
function loadApps(){
  P.getApps({}).then(function(r){
    var seen={};
    apps=(r.items||[]).filter(function(a){if(seen[a.pkg])return false;seen[a.pkg]=1;return true}).sort(function(a,b){return a.name.toLowerCase()<b.name.toLowerCase()?-1:1});
    softRefresh();
  }).catch(function(){});
}
function loadPhone(){
  P=Capacitor.registerPlugin?Capacitor.registerPlugin("PhoneMedia"):Capacitor.Plugins.PhoneMedia;
  loadApps();
  P.getMedia({limit:600}).then(function(r){
    (r.items||[]).forEach(function(m){
      var segs=(m.path||"").split("/"),nm=m.name||segs[segs.length-1]||"";
      items.push({name:nm,size:m.size||0,kind:m.kind,url:Capacitor.convertFileSrc(m.path),ts:(m.taken>0?m.taken:0)||parseTs(nm)||(m.added||0)*1000,album:"f:"+(segs.length>1?segs[segs.length-2]:"Other")});
    });
    refresh(true);loadDocs();
  }).catch(function(){msg="Permission denied. Open phone Settings and allow Gallery AI to access photos and videos.";refresh(true);loadDocs()});
  document.addEventListener("visibilitychange",function(){if(!document.hidden&&docsGranted===false)loadDocs()});
}
var pal=[["#6c4cff","#00b8d9","#ff6ec4"],["#ff512f","#f09819","#ffd200"],["#0f2027","#2c5364","#3ad59f"],["#141e30","#243b55","#7f5cff"],["#11998e","#38ef7d","#0b486b"],["#ee0979","#ff6a00","#3a1c71"],["#1a2a6c","#b21f1f","#fdbb2d"],["#00c6ff","#0072ff","#a18cd1"]];
function demo(){
  pal.forEach(function(p,k){
    var c=document.createElement("canvas");c.width=360;c.height=640;var x=c.getContext("2d");
    var g=x.createLinearGradient(0,0,360,640);g.addColorStop(0,p[0]);g.addColorStop(1,p[1]);x.fillStyle=g;x.fillRect(0,0,360,640);
    for(var i=0;i<5;i++){
      var cx=(Math.sin(k*7+i*2.3)*.5+.5)*360,cy=(Math.cos(k*5+i*1.7)*.5+.5)*640,r=120+((k*37+i*53)%140);
      var rg=x.createRadialGradient(cx,cy,0,cx,cy,r);rg.addColorStop(0,p[2]+"cc");rg.addColorStop(1,p[2]+"00");
      x.fillStyle=rg;x.fillRect(0,0,360,640);
    }
    c.toBlob(function(b){
      if(!b)return;
      items.push({name:"Wallpaper "+(k+1)+".jpg",size:b.size,kind:"image",url:URL.createObjectURL(b),ts:Date.now()-Math.floor(k/3)*86400000-k*3600000,album:"f:Wallpapers"});
      refresh(false);
    },"image/jpeg",0.9);
  });
}
refresh(true);

function currentMedia(){return viewList[vi]}
$("vshare").onclick=function(e){
  e.stopPropagation();
  var it=currentMedia();if(!it)return;
  if(navigator.share){
    fetch(it.url).then(function(res){return res.blob()}).then(function(blob){
      var file=new File([blob],it.name||"media",{type:blob.type||(it.kind==="video"?"video/mp4":"image/jpeg")});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        return navigator.share({files:[file],title:it.name});
      }
      return navigator.share({title:it.name,url:it.url});
    }).catch(function(){toast("Share cancelled or unavailable")});
  }else{
    toast("Sharing is not supported here");
  }
};
$("vdel").onclick=function(e){
  e.stopPropagation();
  var it=currentMedia();if(!it)return;
  if(!confirm("Remove "+(it.name||"this item")+" from gallery?"))return;
  var doRemove=function(){
    items=items.filter(function(x){return x!==it});
    viewList=viewList.filter(function(x){return x!==it});
    if(!viewList.length){history.back();refresh(false);toast("Deleted");return}
    if(vi>=viewList.length)vi=0;
    showView();refresh(false);toast("Deleted");
  };
  if(isNative&&P&&it.id&&typeof P.deleteMedia==="function"){
    P.deleteMedia({id:it.id,path:it.path}).then(doRemove).catch(function(){doRemove()});
  }else{
    doRemove();
  }
};
var edImg=new Image();
function renderEditCanvas(){
  var br=$("edbr").value,ct=$("edct").value,st=$("edst").value,rt=+$("edrt").value;
  $("brv").textContent=br;$("ctv").textContent=ct;$("stv").textContent=st;$("rtv").textContent=rt;
  var cv=$("edcv"),ctx=cv.getContext("2d");
  var rad=rt*Math.PI/180,swap=(rt===90||rt===270);
  var w=edImg.naturalWidth||360,h=edImg.naturalHeight||360;
  var scale=Math.min(600/Math.max(w,h),1);
  var dw=Math.max(1,Math.round(w*scale)),dh=Math.max(1,Math.round(h*scale));
  cv.width=swap?dh:dw;cv.height=swap?dw:dh;
  ctx.save();
  ctx.translate(cv.width/2,cv.height/2);
  ctx.rotate(rad);
  ctx.filter="brightness("+br+"%) contrast("+ct+"%) saturate("+st+"%)";
  ctx.drawImage(edImg,-dw/2,-dh/2,dw,dh);
  ctx.restore();
}
$("vedit").onclick=function(e){
  e.stopPropagation();
  var it=currentMedia();if(!it)return;
  if(it.kind==="video"){toast("Video editing is not supported yet");return}
  $("edbr").value=100;$("edct").value=100;$("edst").value=100;$("edrt").value=0;
  edImg.crossOrigin="anonymous";
  edImg.onload=function(){$("edmdl").classList.add("show");renderEditCanvas()};
  edImg.onerror=function(){toast("Cannot load image for editing")};
  edImg.src=it.url;
};
["edbr","edct","edst","edrt"].forEach(function(id){$(id).addEventListener("input",renderEditCanvas)});
$("edcancel").onclick=function(){$("edmdl").classList.remove("show")};
$("edsave").onclick=function(){
  var it=currentMedia();if(!it)return;
  var cv=$("edcv");
  cv.toBlob(function(blob){
    if(!blob){toast("Could not save image");return}
    var url=URL.createObjectURL(blob);
    var base=(it.name||"photo").replace(/\.[^.]+$/,"");
    var newItem={name:base+"_edited.jpg",size:blob.size,kind:"image",url:url,ts:Date.now(),album:it.album||"f:Edited"};
    items.push(newItem);
    $("edmdl").classList.remove("show");
    refresh(false);
    toast("Saved edited copy");
  },"image/jpeg",0.92);
};

if(isNative)loadPhone();else demo();
})();
</script>
