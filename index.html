<style>
:root{--bg:#fff;--ink:#111;--mute:#6f6f6f;--bar:#efefef;--line:#e4e4e4;--acc:#2f7cf6}
@media (prefers-color-scheme:dark){:root{--bg:#000;--ink:#f2f2f2;--mute:#9b9b9b;--bar:#1e1e1e;--line:#222;--acc:#5b9cff;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
#hd{display:flex;align-items:center;gap:6px;padding:12px 16px 8px}
#back{display:none;align-items:center;justify-content:center;width:40px;height:40px;margin-left:-10px;border:0;background:none;color:var(--ink);font-size:28px}
#title{font-size:28px;font-weight:500;line-height:1.15}
#sub{font-size:13px;color:var(--mute)}
#main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.dh{padding:16px 16px 8px;font-size:15px;font-weight:600}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.t{position:relative;aspect-ratio:1;background:var(--bar);overflow:hidden}
.t img,.t video{width:100%;height:100%;object-fit:cover;display:block}
.pb{position:absolute;left:7px;bottom:5px;color:#fff;font-size:13px;text-shadow:0 0 5px #000}
.ag{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 14px;padding:8px 16px 24px}
.cv{aspect-ratio:1;border-radius:18px;overflow:hidden;background:var(--bar);display:flex;align-items:center;justify-content:center;color:var(--mute)}
.cv img,.cv video{width:100%;height:100%;object-fit:cover;display:block}
.cv.apc{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px;align-content:center}
.cv.apc img{border-radius:12px;object-fit:contain}
.nm{margin-top:6px;font-size:15px}
.ct{font-size:13px;color:var(--mute)}
.empty{padding:70px 28px;text-align:center;color:var(--mute);line-height:1.7}
.btn{margin-top:16px;border:0;border-radius:99px;background:var(--acc);color:#fff;font:600 16px system-ui,sans-serif;padding:12px 28px}
.row{display:flex;align-items:center;gap:14px;padding:10px 16px}
.ext{flex:none;width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;background:#7a7a7a}
.ext.pdf{background:#e5493a}.ext.doc,.ext.docx,.ext.rtf,.ext.odt{background:#2f7cf6}.ext.xls,.ext.xlsx,.ext.csv,.ext.ods{background:#1fa463}.ext.ppt,.ext.pptx,.ext.odp{background:#f08a24}
.rt{min-width:0}
.rn{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rm{font-size:12px;color:var(--mute)}
.apg{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 4px;padding:14px 8px 24px}
.app{text-align:center;font-size:12px;min-width:0;padding:0 2px}
.app img{width:56px;height:56px;display:block;margin:0 auto 6px}
.app div{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.25}
#nav{display:flex;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav button{flex:1;border:0;background:none;color:var(--mute);padding:8px 0 10px;font-family:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px}
#nav .ic{padding:4px 20px;border-radius:99px;display:flex}
#nav button.on{color:var(--ink);font-weight:600}
#nav button.on .ic{background:var(--bar)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;display:none;z-index:20;max-width:90%}
#vw{position:fixed;inset:0;background:#000;display:none;z-index:9;color:#fff}
#vw.show{display:block}
#vbox{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#vbox img,#vbox video{width:100%;height:100%;object-fit:contain}
.vtop{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;align-items:center;gap:4px;padding:calc(10px + env(safe-area-inset-top,0px)) 10px 28px;background:linear-gradient(rgba(0,0,0,.65),transparent);transition:opacity .2s}
#vback{background:none;border:0;color:#fff;font-size:28px;width:44px;height:44px}
#vt{font-size:16px;font-weight:600}
#vn{font-size:12px;opacity:.8;word-break:break-all}
#vw.hide .vtop{opacity:0;pointer-events:none}

:root{--bg:#f6f7fb;--ink:#14161c;--mute:#7b8190;--bar:#e6e8ef;--line:#e3e6ee;--acc:#6d5dfc;--card:#fff;--rb:linear-gradient(100deg,#ff4d4d,#ffa63d,#ffd93d,#3ddc84,#2dc7ff,#6d5dfc,#d94dff)}
@media (prefers-color-scheme:dark){:root{--bg:#0b0c10;--ink:#f1f2f6;--mute:#8b91a1;--bar:#1a1c24;--line:#20232c;--acc:#8b7dff;--card:#161820}}
#hd{padding:14px 18px 10px}
#title{font-size:30px;font-weight:800;letter-spacing:-.5px;background:var(--rb);-webkit-background-clip:text;background-clip:text;color:transparent;width:max-content;max-width:100%}
#sub{margin-top:2px}
#main{padding-bottom:124px}
.dh{position:sticky;top:0;z-index:2;background:var(--bg);padding:14px 18px 8px;font-size:14px;font-weight:700}
.g{gap:3px;padding:0 4px}
.t{border-radius:7px}
.t:active{transform:scale(.96);transition:transform .1s}
.pb{left:auto;right:6px;bottom:6px;background:rgba(0,0,0,.55);border-radius:99px;padding:1px 8px;font-size:11px;text-shadow:none}
.ag{padding:8px 18px 24px}
.cv{border-radius:20px}
.nm{font-weight:600}
#nav{position:fixed;left:16px;right:16px;bottom:calc(26px + env(safe-area-inset-bottom,0px));border:0;border-radius:30px;background:var(--card);box-shadow:0 6px 22px rgba(0,0,0,.2);padding:6px 8px;z-index:5}

.vbot button{background:none;border:0;color:#fff;display:flex;flex-direction:column;align-items:center;gap:5px;font:500 12px system-ui,sans-serif;min-width:76px}

#nav{position:static;left:auto;right:auto;bottom:auto;border-radius:0;box-shadow:none;background:#12141c;border-top:1px solid var(--line);padding:6px 8px 2px;z-index:auto}
#dev{position:static;background:#12141c;padding:0 0 calc(7px + env(safe-area-inset-bottom,0px));z-index:auto}
#main{padding-bottom:12px}
#toast{bottom:96px}
#hd{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:0;right:0;z-index:3;display:flex;align-items:center;gap:8px;padding:0 14px;pointer-events:none}

</style>
</head>
<body>
<div id="hd">
  <button id="back" aria-label="Back">&#8249;</button>
  <div><div id="title">Gallery</div><div id="sub"></div></div>
</div>
<div id="main"></div>
<div id="nav">
  <button id="tpics" class="on"><span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg></span>Pictures</button>
  <button id="talb"><span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg></span>Albums</button>
</div>
<div id="dev">Developed by : Towhid M.</div>
<div id="toast"></div>
<div id="vw"><div id="vbox"></div><div class="vtop"><button id="vback" aria-label="Close">&#8249;</button><div><div id="vt"></div><div id="vn"></div></div></div><div class="vbot"><button id="bshare"><svg viewBox="0 0 24 24"><path d="M4 12v7a1 1 0 001 1h14a1 1 0 001-1v-7M16 6l-4-4-4 4M12 2v13"/></svg>Share</button><button id="bedit"><svg viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>Edit</button><button id="bdel"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v5M14 11v5"/></svg>Delete</button></div></div>
<div id="dlg"><div class="dbox"><div class="dt">Delete this item?</div><div class="dd">It will be removed from your phone permanently.</div><div class="dbtn"><button id="dno">Cancel</button><button id="dyes" class="red">Delete</button></div></div></div>
<div id="ed"><div class="etop"><button id="edx" aria-label="Cancel">&#10005;</button><b>Edit</b><button id="edsave" class="esv">Save</button></div><div id="edv"><canvas id="edc"></canvas></div><div class="epan"><div class="etools"><button data-a="rl"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 109-9 9 9 0 00-6.4 2.6L3 8M3 3v5h5"/></svg></button><button data-a="rr"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 11-9-9 9 9 0 016.4 2.6L21 8M21 3v5h-5"/></svg></button><button data-a="fh"><svg viewBox="0 0 24 24"><path d="M12 3v18M8 7L3 12l5 5V7zM16 7l5 5-5 5V7z"/></svg></button><button data-a="fv"><svg viewBox="0 0 24 24"><path d="M3 12h18M7 8l5-5 5 5H7zM7 16l5 5 5-5H7z"/></svg></button></div><div class="sl"><span>Brightness</span><input type="range" id="sbr" min="50" max="150" value="100"></div><div class="sl"><span>Contrast</span><input type="range" id="sco" min="50" max="150" value="100"></div><div class="sl"><span>Color</span><input type="range" id="ssa" min="0" max="200" value="100"></div><div class="chips" id="chips"><button data-p="none" class="on">Original</button><button data-p="bw">B&amp;W</button><button data-p="warm">Warm</button><button data-p="cool">Cool</button><button data-p="vivid">Vivid</button><button data-p="fade">Fade</button></div></div></div>
<script>
(function(){
var items=[],docs=[],apps=[],docsGranted=null,tab="pics",album=null,viewList=[],vi=0,viewOpen=false,msg="Nothing found",P=null;
var K_VID="__vid",K_DOCS="__docs",K_APPS="__apps";
function $(i){return document.getElementById(i)}
var isNative=!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
function parseTs(n){
  var m=n.match(/(20\d{2})[-_.]?(\d{2})[-_.]?(\d{2})/);if(!m)return 0;
  var y=+m[1],mo=+m[2],d=+m[3];if(mo<1||mo>12||d<1||d>31)return 0;
  var t=n.slice(m.index+m[0].length).match(/^[-_.\s]?(\d{2})(\d{2})(\d{2})/);
  var H=t&&+t[1]<24?+t[1]:0,M=t&&+t[2]<60?+t[2]:0,S=t&&+t[3]<60?+t[3]:0;
  return new Date(y,mo-1,d,H,M,S).getTime();
}
function fmtDate(ts){var d=new Date(ts),o={weekday:"long",month:"long",day:"numeric"};if(d.getFullYear()!==new Date().getFullYear())o.year="numeric";return d.toLocaleDateString("en-US",o)}
function fmtTime(ts){return new Date(ts).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"})}
function fmtSize(b){return b>=1048576?(b/1048576).toFixed(2)+" MB":Math.max(1,Math.round(b/1024))+" KB"}
function label(k){return k===K_VID?"Videos":k===K_DOCS?"Documents":k===K_APPS?"Apps":k.slice(2)}
function toast(t){var e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display="none"},2500)}
var main=$("main");
var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){var m=e.target;m.src=m.dataset.src+(m.tagName==="VIDEO"?"#t=0.1":"");io.unobserve(m)}})},{root:main,rootMargin:"500px"});
function media(it){
  var m;
  if(it.kind==="video"){m=document.createElement("video");m.muted=true;m.playsInline=true;m.preload="metadata"}
  else{m=document.createElement("img");m.alt="";m.decoding="async"}
  m.dataset.src=it.url;io.observe(m);return m;
}
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function tile(it,list,i){
  var d=el("div","t");d.appendChild(media(it));
  if(it.kind==="video")d.appendChild(el("span","pb","\u25B6"));
  d.onclick=function(){openView(list,i)};return d;
}
function emptyEl(t){return el("div","empty",t||msg)}
function drawPics(list){
  io.disconnect();main.innerHTML="";
  if(!list.length){main.appendChild(emptyEl());return}
  var grid=null,last=null;
  list.forEach(function(it,i){
    var key=it.ts?new Date(it.ts).toDateString():"0";
    if(key!==last){last=key;main.appendChild(el("div","dh",it.ts?fmtDate(it.ts):"Unknown date"));grid=el("div","g");main.appendChild(grid)}
    grid.appendChild(tile(it,list,i));
  });
}
function albumItems(k){return k===K_VID?items.filter(function(i){return i.kind==="video"}):items.filter(function(i){return i.album===k})}
function openAlbum(k){album=k;history.pushState({a:1},"","#a");refresh(true)}
function albumCard(k,cover,count){
  var a=el("div");a.appendChild(cover);a.appendChild(el("div","nm",label(k)));a.appendChild(el("div","ct",count));
  a.onclick=function(){openAlbum(k)};return a;
}
function drawAlbums(){
  io.disconnect();main.innerHTML="";
  var names=[],map={};
  items.forEach(function(i){if(!map[i.album]){map[i.album]=[];names.push(i.album)}map[i.album].push(i)});
  var g=el("div","ag");
  names.forEach(function(k){var cv=el("div","cv");cv.appendChild(media(map[k][0]));g.appendChild(albumCard(k,cv,String(map[k].length)))});
  var vids=albumItems(K_VID);
  if(vids.length){var cv=el("div","cv");cv.appendChild(media(vids[0]));g.appendChild(albumCard(K_VID,cv,String(vids.length)))}
  if(isNative){
    var dc=el("div","cv");
    dc.innerHTML='<svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/></svg>';
    g.appendChild(albumCard(K_DOCS,dc,docsGranted===false?"Allow access":String(docs.length)));
    var ac=el("div","cv apc");
    apps.slice(0,4).forEach(function(a){var im=el("img");im.alt="";im.src=a.icon;ac.appendChild(im)});
    g.appendChild(albumCard(K_APPS,ac,String(apps.length)));
  }
  if(!g.children.length){main.appendChild(emptyEl());return}
  main.appendChild(g);
}
function drawDocs(){
  io.disconnect();main.innerHTML="";
  if(docsGranted===false){
    var w=emptyEl("Documents need \u201CAll files access\u201D. Tap Allow, switch it on for Gallery AI, then come back.");
    var b=el("button","btn","Allow access");b.onclick=function(){P.requestFilesAccess()};
    w.appendChild(el("br"));w.appendChild(b);main.appendChild(w);return;
  }
  if(!docs.length){main.appendChild(emptyEl("No documents found"));return}
  docs.forEach(function(d){
    var r=el("div","row"),e=el("div","ext "+d.ext,d.ext.toUpperCase().slice(0,4)),t=el("div","rt");
    t.appendChild(el("div","rn",d.name));t.appendChild(el("div","rm",fmtSize(d.size)+(d.ts?" \u00B7 "+fmtDate(d.ts):"")));
    r.appendChild(e);r.appendChild(t);
    r.onclick=function(){P.openDoc({id:d.id,mime:d.mime}).catch(function(){toast("No app can open this file")})};
    main.appendChild(r);
  });
}
function drawApps(){
  io.disconnect();main.innerHTML="";
  if(!apps.length){main.appendChild(emptyEl("No apps found"));return}
  var g=el("div","apg");
  apps.forEach(function(a){
    var d=el("div","app"),im=el("img");im.alt="";im.src=a.icon;d.appendChild(im);d.appendChild(el("div",null,a.name));
    d.onclick=function(){P.launchApp({pkg:a.pkg}).catch(function(){toast("Cannot open this app")})};
    g.appendChild(d);
  });
  main.appendChild(g);
}
function refresh(top){
  items.sort(function(a,b){return b.ts-a.ts});
  var p=0,v=0;items.forEach(function(i){if(i.kind==="video")v++;else p++});
  $("title").textContent=album?label(album):"Gallery";
  $("sub").textContent=album===K_DOCS?docs.length+" documents":album===K_APPS?apps.length+" apps":album?albumItems(album).length+" items":p+" photos \u00B7 "+v+" videos";
  $("back").style.display=album?"flex":"none";document.body.classList.toggle("ina",!!album);
  $("tpics").className=tab==="pics"?"on":"";$("talb").className=tab==="albums"?"on":"";
  if(album===K_DOCS)drawDocs();else if(album===K_APPS)drawApps();else if(album)drawPics(albumItems(album));else if(tab==="albums")drawAlbums();else drawPics(items);
  if(top)main.scrollTop=0;
}
function showView(){
  var it=viewList[vi],box=$("vbox");box.innerHTML="";var m;
  if(it.kind==="video"){m=el("video");m.controls=true;m.autoplay=true;m.playsInline=true}
  else{m=el("img");m.alt=""}
  m.src=it.url;box.appendChild(m);
  $("vt").textContent=it.ts?fmtDate(it.ts)+", "+fmtTime(it.ts):it.name;
  $("vn").textContent=it.name+" \u00B7 "+fmtSize(it.size);setActs(it);zs=1;zx=0;zy=0;
}
function openView(list,i){
  viewList=list;vi=i;showView();$("vw").classList.add("show");$("vw").classList.remove("hide");
  if(!viewOpen){viewOpen=true;history.pushState({v:1},"","#v")}
}
function closeView(){$("vw").classList.remove("show");$("vbox").innerHTML="";viewOpen=false}
function step(d){if(!viewList.length)return;vi=(vi+d+viewList.length)%viewList.length;showView()}
$("vback").onclick=function(){if(viewOpen)history.back()};
$("back").onclick=function(){if(album)history.back()};
window.addEventListener("popstate",function(){if(edOpen){closeEd(true);return}if(viewOpen)closeView();else if(album){album=null;refresh(true)}});
$("vbox").addEventListener("click",function(){$("vw").classList.toggle("hide")});
var sx=0;
$("vw").addEventListener("touchstart",function(e){sx=e.touches[0].clientX},{passive:true});
$("vw").addEventListener("touchend",function(e){var dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>70&&zs<=1.02&&!zmulti)step(dx<0?1:-1)},{passive:true});
$("tpics").onclick=function(){tab="pics";album=null;refresh(true)};
$("talb").onclick=function(){tab="albums";album=null;refresh(true)};
function softRefresh(){if(tab==="albums"||album)refresh(false)}
function loadDocs(){
  P.getDocs({}).then(function(r){
    docsGranted=!!r.granted;
    docs=(r.items||[]).map(function(m){var n=m.name||"",x=n.indexOf(".")>-1?n.split(".").pop().toLowerCase():"file";return{id:m.id,name:n,size:m.size||0,mime:m.mime||"",ext:x,ts:(m.date||0)*1000}});
    softRefresh();
  }).catch(function(){});
}
function loadApps(){
  P.getApps({}).then(function(r){
    var seen={};
    apps=(r.items||[]).filter(function(a){if(seen[a.pkg])return false;seen[a.pkg]=1;return true}).sort(function(a,b){return a.name.toLowerCase()<b.name.toLowerCase()?-1:1});
    softRefresh();
  }).catch(function(){});
}
function mapItems(r){return (r.items||[]).map(function(m){var segs=(m.path||"").split("/"),nm=m.name||segs[segs.length-1]||"";return{id:m.id,name:nm,size:m.size||0,kind:m.kind,url:Capacitor.convertFileSrc(m.path),ts:(m.taken>0?m.taken:0)||parseTs(nm)||(m.added||0)*1000,album:"f:"+(segs.length>1?segs[segs.length-2]:"Other")}})}
function loadMedia(limit,first){
  return P.getMedia({limit:limit}).then(function(r){var st=main.scrollTop;items=mapItems(r);refresh(first);if(!first)main.scrollTop=st}).catch(function(){msg="Permission denied. Open phone Settings and allow Gallery AI to access photos and videos.";refresh(true)});
}
function loadPhone(){
  P=Capacitor.registerPlugin?Capacitor.registerPlugin("PhoneMedia"):Capacitor.Plugins.PhoneMedia;
  loadMedia(90,true).then(function(){setTimeout(function(){loadMedia(5000,false);setTimeout(function(){loadApps();loadDocs()},700)},250)});
  document.addEventListener("visibilitychange",function(){if(!document.hidden&&docsGranted===false)loadDocs()});
}
var pal=[["#6c4cff","#00b8d9","#ff6ec4"],["#ff512f","#f09819","#ffd200"],["#0f2027","#2c5364","#3ad59f"],["#141e30","#243b55","#7f5cff"],["#11998e","#38ef7d","#0b486b"],["#ee0979","#ff6a00","#3a1c71"],["#1a2a6c","#b21f1f","#fdbb2d"],["#00c6ff","#0072ff","#a18cd1"]];
function demo(){
  pal.forEach(function(p,k){
    var c=document.createElement("canvas");c.width=360;c.height=640;var x=c.getContext("2d");
    var g=x.createLinearGradient(0,0,360,640);g.addColorStop(0,p[0]);g.addColorStop(1,p[1]);x.fillStyle=g;x.fillRect(0,0,360,640);
    for(var i=0;i<5;i++){
      var cx=(Math.sin(k*7+i*2.3)*.5+.5)*360,cy=(Math.cos(k*5+i*1.7)*.5+.5)*640,r=120+((k*37+i*53)%140);
      var rg=x.createRadialGradient(cx,cy,0,cx,cy,r);rg.addColorStop(0,p[2]+"cc");rg.addColorStop(1,p[2]+"00");
      x.fillStyle=rg;x.fillRect(0,0,360,640);
    }
    c.toBlob(function(b){
      if(!b)return;
      items.push({name:"Wallpaper "+(k+1)+".jpg",size:b.size,kind:"image",url:URL.createObjectURL(b),ts:Date.now()-Math.floor(k/3)*86400000-k*3600000,album:"f:Wallpapers"});
      refresh(false);
    },"image/jpeg",0.9);
  });
}

var edOpen=false,ed={};
var PRE={none:"",bw:"grayscale(1)",warm:"sepia(.35) saturate(1.2)",cool:"hue-rotate(185deg) saturate(.9) brightness(1.03)",vivid:"saturate(1.6) contrast(1.1)",fade:"contrast(.85) brightness(1.1) saturate(.85)"};
function cur(){return viewList[vi]}
function setActs(it){$("bedit").style.display=(it.kind==="video"||!it.id)?"none":"flex"}
function needApp(){toast("Works in the installed app")}
$("bshare").onclick=function(){var it=cur();if(!P||!it.id)return needApp();P.shareMedia({id:it.id,kind:it.kind}).catch(function(){toast("Could not share")})};
$("bdel").onclick=function(){var it=cur();if(!P||!it.id)return needApp();$("dlg").classList.add("show")};
$("dno").onclick=function(){$("dlg").classList.remove("show")};
$("dyes").onclick=function(){
  var it=cur();$("dlg").classList.remove("show");
  P.deleteMedia({id:it.id,kind:it.kind}).then(function(){
    function not(x){return x.id!==it.id||x.kind!==it.kind}
    items=items.filter(not);viewList=viewList.filter(not);toast("Deleted");
    if(!viewList.length)history.back();else{if(vi>=viewList.length)vi=0;showView()}
    refresh(false);
  }).catch(function(){toast("Allow All files access to delete");setTimeout(function(){P.requestFilesAccess()},1100)});
};
function edFilter(){return "brightness("+ed.br+"%) contrast("+ed.co+"%) saturate("+ed.sa+"%) "+PRE[ed.preset]}
function edDraw(mx){
  var im=ed.img,sw=im.naturalWidth,sh=im.naturalHeight,r=ed.rot%180!==0,w=r?sh:sw,h=r?sw:sh,s=Math.min(1,mx/Math.max(w,h));
  var c=$("edc");c.width=Math.round(w*s);c.height=Math.round(h*s);
  var x=c.getContext("2d");x.filter=edFilter();
  x.translate(c.width/2,c.height/2);x.rotate(ed.rot*Math.PI/180);x.scale(ed.fx?-1:1,ed.fy?-1:1);
  x.drawImage(im,-sw*s/2,-sh*s/2,sw*s,sh*s);
}
var edRaf=0;function edSched(){cancelAnimationFrame(edRaf);edRaf=requestAnimationFrame(function(){edDraw(1080)})}
function edMark(p){[].forEach.call($("chips").children,function(b){b.className=b.dataset.p===p?"on":""})}
function openEdit(){
  var it=cur(),im=new Image();
  im.onload=function(){ed={img:im,rot:0,fx:false,fy:false,br:100,co:100,sa:100,preset:"none"};$("sbr").value=$("sco").value=$("ssa").value=100;edMark("none");edOpen=true;history.pushState({e:1},"","#e");$("ed").classList.add("show");edDraw(1080)};
  im.onerror=function(){toast("Cannot open this photo")};im.src=it.url;
}
function closeEd(pop){if(!pop){history.back();return}edOpen=false;$("ed").classList.remove("show")}
$("bedit").onclick=openEdit;
$("edx").onclick=function(){closeEd(false)};
[].forEach.call(document.querySelectorAll(".etools button"),function(b){b.onclick=function(){var a=b.dataset.a;if(a==="rl")ed.rot=(ed.rot+270)%360;else if(a==="rr")ed.rot=(ed.rot+90)%360;else if(a==="fh")ed.fx=!ed.fx;else ed.fy=!ed.fy;edSched()}});
$("sbr").oninput=function(){ed.br=+this.value;edSched()};
$("sco").oninput=function(){ed.co=+this.value;edSched()};
$("ssa").oninput=function(){ed.sa=+this.value;edSched()};
$("chips").onclick=function(e){var p=e.target.dataset.p;if(!p)return;ed.preset=p;edMark(p);edSched()};
$("edsave").onclick=function(){
  if(!P)return needApp();
  edDraw(2400);var d=$("edc").toDataURL("image/jpeg",.92).split(",")[1];
  P.saveImage({data:d}).then(function(){toast("Saved as a new copy");closeEd(false);loadMedia(5000,false)}).catch(function(){toast("Could not save")});
};

var zs=1,zx=0,zy=0,zmulti=false,zd0=0,zs0=1,zp=null,lastTap=0;
function zApply(){
  var m=$("vbox").firstChild;if(!m||m.tagName!=="IMG")return;
  var bw=$("vbox").clientWidth,bh=$("vbox").clientHeight,mx=(zs-1)*bw/2,my=(zs-1)*bh/2;
  zx=Math.max(-mx,Math.min(mx,zx));zy=Math.max(-my,Math.min(my,zy));
  m.style.transform="translate("+zx+"px,"+zy+"px) scale("+zs+")";
}
function zDist(t){return Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)}
$("vbox").addEventListener("touchstart",function(e){
  var m=this.firstChild;if(!m||m.tagName!=="IMG")return;
  if(e.touches.length===2){zmulti=true;zd0=zDist(e.touches);zs0=zs}
  else if(e.touches.length===1){zp={x:e.touches[0].clientX,y:e.touches[0].clientY,tx:zx,ty:zy,moved:false}}
},{passive:true});
$("vbox").addEventListener("touchmove",function(e){
  var m=this.firstChild;if(!m||m.tagName!=="IMG")return;
  if(e.touches.length===2){e.preventDefault();zs=Math.min(5,Math.max(1,zs0*zDist(e.touches)/zd0));if(zs===1){zx=0;zy=0}zApply()}
  else if(e.touches.length===1&&zp&&!zmulti){
    var dx=e.touches[0].clientX-zp.x,dy=e.touches[0].clientY-zp.y;
    if(Math.abs(dx)>8||Math.abs(dy)>8)zp.moved=true;
    if(zs>1){e.preventDefault();zx=zp.tx+dx;zy=zp.ty+dy;zApply()}
  }
},{passive:false});
$("vbox").addEventListener("touchend",function(e){
  var m=this.firstChild;if(!m||m.tagName!=="IMG"||e.touches.length>0)return;
  if(!zmulti&&zp&&!zp.moved){
    var n=Date.now();
    if(n-lastTap<300){if(zs>1){zs=1;zx=0;zy=0}else{zs=2.5;zx=0;zy=0}zApply();lastTap=0}else lastTap=n;
  }
  if(zs<1.05){zs=1;zx=0;zy=0;zApply()}
  setTimeout(function(){zmulti=false},60);
},{passive:true});
refresh(true);
if(isNative)loadPhone();else demo();
})();
</script>
